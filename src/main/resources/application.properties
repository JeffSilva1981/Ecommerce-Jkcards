spring.config.import=optional:file:./.env[.properties]

spring.profiles.active=dev

# =========================
# SERVER
# =========================
server.port=8080

# =========================
# SECURITY
# =========================
security.jwt.duration=${JWT_DURATION:86400}
security.jwt.private-key=${JWT_PRIVATE_KEY_PATH:file:./secrets/jwt-private.pem}
security.jwt.public-key=${JWT_PUBLIC_KEY_PATH:file:./secrets/jwt-public.pem}

# =========================
# CLOUDINARY
# =========================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =========================
# MERCADO PAGO
# =========================
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}

# =========================
# APPLICATION
# =========================
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# =========================
# E-MAIL
# =========================
app.mail-from=${MAIL_FROM:no-reply@jkcards.tech}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.test-connection=false

# =========================
# MELHOR ENVIO
# =========================
melhor-envio.base-url=${MELHOR_ENVIO_BASE_URL:https://sandbox.melhorenvio.com.br/api/v2}
melhor-envio.authorization-url=${MELHOR_ENVIO_AUTHORIZATION_URL:https://sandbox.melhorenvio.com.br/oauth/authorize}
melhor-envio.token-url=${MELHOR_ENVIO_TOKEN_URL:https://sandbox.melhorenvio.com.br/oauth/token}
melhor-envio.token=${MELHOR_ENVIO_TOKEN:}
melhor-envio.origin-postal-code=${MELHOR_ENVIO_ORIGIN_POSTAL_CODE:}
melhor-envio.user-agent=${MELHOR_ENVIO_USER_AGENT:JKCards (contato.jkcards@gmail.com)}
melhor-envio.client-id=${MELHOR_ENVIO_CLIENT_ID:}
melhor-envio.client-secret=${MELHOR_ENVIO_CLIENT_SECRET:}
melhor-envio.redirect-uri=${MELHOR_ENVIO_REDIRECT_URI:https://jkcards.tech/shipping/oauth/callback}
